# DXC SAM DB Datasource
infra.datasource.dxc-sam-db:
  jdbc:
    url: jdbc:sqlserver://10.14.33.22;databaseName=SAM;encrypt=true;trustServerCertificate=true
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: dxc_user
    password: patiwat
  hikari:
    connection-timeout: 20000 #maximum number of milliseconds that a client will wait for a connection
    minimum-idle: 5 #minimum number of idle connections maintained by HikariCP in a connection pool
    maximum-pool-size: 10 #maximum pool size
    idle-timeout: 10000 #maximum idle time for connection
    max-lifetime: 30000 # maximum lifetime in milliseconds of a connection in the pool after it is closed.
  jpa:
    show-sql: false # Attention Required!!
    database-platform: org.hibernate.dialect.SQLServerDialect
