image: adoptopenjdk/maven-openjdk11-openj9

stages:
  - package-and-deploy-jar
  - build-and-push-docker-image

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=INFO -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "--batch-mode -s .m2/settings.xml --errors --fail-at-end --show-version -DinstallAtEnd=true  -Dmaven.test.skip=true"
  CACHE_KEY: $CI_COMMIT_REF_SLUG
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_IMAGE_URL: gitlab.clearskysolutions.co.th:4567/$CI_PROJECT_PATH

cache:
  key: $CACHE_KEY
  paths:
#   - ./.m2/repository
   - .sbt

package-and-deploy-jar:
  stage: package-and-deploy-jar
  script:
    - echo "Deploying package-and-deploy-jar"
    - "mvn deploy -U $MAVEN_CLI_OPTS"
  artifacts:
    expire_in: 10 min
    paths:
    - "target/*.jar"
  only: 
   - tags

build-and-push-docker-image:
  stage: build-and-push-docker-image
  image: docker:latest
  services:
  - docker:dind
  # Remember that even though the JAR file was built in a separate image
  #  Gitlab CI will make it available in this image because I specified it in artifacts
  #
  # All I really need to build the Docker image is the artifact(s) & Dockerfile
  script:
  - echo "Deploying"
  - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN gitlab.clearskysolutions.co.th:4567
  - docker build --no-cache=true --tag $DOCKER_IMAGE_URL:$CI_COMMIT_TAG --tag $DOCKER_IMAGE_URL:latest .
  - docker push $DOCKER_IMAGE_URL:$CI_COMMIT_TAG
  - docker push $DOCKER_IMAGE_URL:latest
  only: 
   - tags
